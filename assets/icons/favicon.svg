<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="수학 성 수호자">
  <!-- 탭에 16~32px로 그려지므로 성 스프라이트(189×256)를 줄이면 뭉개진다.
       실루엣만 남긴 단순 도형이라 작은 크기에서도 성으로 읽힌다. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2445"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa3d9"/>
      <stop offset="1" stop-color="#4a5a8f"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sky)"/>

  <!-- 첨탑 3개 -->
  <path d="M32 6 L38 20 H26 Z" fill="#a855f7"/>
  <path d="M15 14 L20 24 H10 Z" fill="#7c3aed"/>
  <path d="M49 14 L54 24 H44 Z" fill="#7c3aed"/>

  <!-- 탑 몸통 -->
  <rect x="26" y="20" width="12" height="30" fill="url(#stone)"/>
  <rect x="10" y="24" width="10" height="26" fill="url(#stone)"/>
  <rect x="44" y="24" width="10" height="26" fill="url(#stone)"/>

  <!-- 성벽 + 총안 -->
  <rect x="18" y="34" width="28" height="16" fill="#5c6da8"/>
  <rect x="18" y="32" width="5" height="4" fill="#5c6da8"/>
  <rect x="27" y="32" width="5" height="4" fill="#5c6da8"/>
  <rect x="36" y="32" width="5" height="4" fill="#5c6da8"/>

  <!-- 성문 -->
  <path d="M28 50 v-8 a4 4 0 0 1 8 0 v8 Z" fill="#0a0e1a"/>

  <!-- 창문 불빛 (시안 = 게임 액센트) -->
  <rect x="13.5" y="30" width="3" height="4" rx="1.2" fill="#00e5ff"/>
  <rect x="47.5" y="30" width="3" height="4" rx="1.2" fill="#00e5ff"/>
  <rect x="30.5" y="24" width="3" height="4" rx="1.2" fill="#ffd700"/>

  <!-- 지면 -->
  <rect x="6" y="50" width="52" height="4" rx="2" fill="#3b2f4a"/>
</svg>
